<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miras Avcıları</title>
  <!-- ?s=... sürüm numarası: alanlar.js veya stil.css değişince 1 artırın ki telefonlar eskisini kullanmasın -->
  <link rel="stylesheet" href="stil.css?s=2">
  <!-- Google model-viewer: 3D gösterim + telefonda "Odamda Gör" (AR) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <script src="alanlar.js?s=2"></script>
</head>
<body>
  <header>
    <h1>🏛️ Miras Avcıları</h1>
    <p>Türkiye'nin UNESCO Dünya Mirası alanları</p>
  </header>
  <main id="icerik"></main>

<script>
// Kartın QR kodu bu sayfayı ?alan=efes gibi bir adresle açar.
const params = new URLSearchParams(location.search);
const secili = ALANLAR.find(a => a.id === params.get("alan"));
const icerik = document.getElementById("icerik");

function el(etiket, ozellik = {}, yazi) {
  const e = document.createElement(etiket);
  for (const [k, v] of Object.entries(ozellik)) e.setAttribute(k, v);
  if (yazi !== undefined) e.textContent = yazi;
  return e;
}

// "Avlanan" alanlar bu telefonda saklanır (gizli sekmede saklanmayabilir, sorun değil).
function avlananlar() {
  try { return JSON.parse(localStorage.getItem("mirasAvcilari.avlanan") || "[]"); }
  catch { return []; }
}
function avla(id) {
  try {
    const liste = new Set(avlananlar());
    liste.add(id);
    localStorage.setItem("mirasAvcilari.avlanan", JSON.stringify([...liste]));
  } catch {}
}

function galeri() {
  const av = avlananlar();
  const ust = el("div", { class: "ust-dugmeler" });
  ust.append(el("a", { class: "dugme dolu", href: "ar.html" }, "📷 Kartı Tara (AR)"));
  icerik.append(ust);
  icerik.append(el("p", { class: "ilerleme" },
    `Avladığın alan: ${av.length} / ${ALANLAR.length}`));

  const izgara = el("div", { class: "izgara" });
  for (const a of ALANLAR) {
    const kart = el("a", { class: "alan-karti", href: `?alan=${a.id}`, style: `--renk:${a.renk}` });
    kart.append(el("strong", {}, a.ad), el("span", {}, `${a.il} · ${a.unescoYili}`));
    if (av.includes(a.id)) kart.append(el("span", { class: "rozet" }, "✓ Avlandı"));
    izgara.append(kart);
  }
  icerik.append(izgara);
}

function ayrinti(a) {
  document.title = `${a.ad} · Miras Avcıları`;
  icerik.append(el("a", { class: "geri", href: "index.html" }, "← Tüm alanlar"));
  icerik.append(el("h2", { style: "margin:4px 0 10px" }, a.ad));

  const mv = el("model-viewer", {
    src: a.model,
    alt: `${a.ad} 3D modeli`,
    ar: "",
    "ar-modes": "webxr scene-viewer quick-look",
    "ar-scale": "auto",
    "camera-controls": "",
    "auto-rotate": "",
    "touch-action": "pan-y",
    "shadow-intensity": "1",
    exposure: "1.1"
  });
  mv.append(el("button", { slot: "ar-button", class: "ar-dugmesi" }, "📱 Odamda Gör"));

  // Birden çok noktası olan alanlarda (ör. Efes) sekmelerle model ve bilgi değişir
  const noktaKutu = el("div", { class: "kutu" });
  if (a.noktalar) {
    const sekmeler = el("div", { class: "sekmeler" });
    const noktaBaslik = el("h3");
    const noktaBilgi = el("p", { style: "margin:0" });
    a.noktalar.forEach((n, i) => {
      const b = el("button", { type: "button" }, n.ad);
      b.onclick = () => {
        sekmeler.querySelectorAll("button").forEach(x => x.classList.toggle("secili", x === b));
        mv.src = n.model;
        noktaBaslik.textContent = `📍 ${n.ad}`;
        noktaBilgi.textContent = n.bilgi;
      };
      sekmeler.append(b);
      if (i === 0) b.click();
    });
    noktaKutu.append(noktaBaslik, noktaBilgi);
    icerik.append(sekmeler);
  }
  icerik.append(mv);
  if (a.noktalar) icerik.append(noktaKutu);

  const etiketler = el("div", { class: "etiketler" });
  etiketler.append(
    el("span", { class: "etiket" }, `📍 ${a.il}`),
    el("span", { class: "etiket" }, `🗓️ ${a.donem}`),
    el("span", { class: "etiket" }, `🌍 UNESCO: ${a.unescoYili}`)
  );
  icerik.append(etiketler);

  const ozet = el("div", { class: "kutu" });
  ozet.append(el("h3", {}, "Kısaca"), el("p", { style: "margin:0" }, a.ozet));
  const bmy = el("div", { class: "kutu" });
  bmy.append(el("h3", {}, "💡 Biliyor muydun?"), el("p", { style: "margin:0" }, a.biliyorMuydun));
  icerik.append(ozet, bmy);

  // Sorular: hepsi doğru cevaplanınca alan "avlanır" (oyundaki puanla eşleştirilebilir)
  const toplam = a.sorular.length;
  let bilinen = 0;
  const durum = el("div", { class: "kutu" });
  const durumYazi = el("div", { class: "sonuc", style: "margin:0" }, `🎯 Avlamak için ${toplam} soruyu da doğru cevapla (0/${toplam})`);
  durum.append(durumYazi);
  icerik.append(durum);

  a.sorular.forEach((q, n) => {
    const kutu = el("div", { class: "kutu" });
    kutu.append(el("h3", {}, `Soru ${n + 1}. ${q.metin}`));
    const secenekler = el("div", { class: "secenekler" });
    const sonuc = el("div", { class: "sonuc" });
    // Seçenek sırası her açılışta karışır; doğru cevabın yeri ezberlenmesin
    const sira = q.secenekler.map((_, i) => i).sort(() => Math.random() - 0.5);
    for (const i of sira) {
      const b = el("button", { type: "button" }, q.secenekler[i]);
      b.onclick = () => {
        if (i === q.dogru) {
          b.classList.add("dogru");
          sonuc.textContent = "Doğru!";
          sonuc.style.color = "var(--dogru)";
          secenekler.querySelectorAll("button").forEach(x => x.disabled = true);
          bilinen++;
          if (bilinen === toplam) {
            durumYazi.textContent = "Tebrikler! Bu alanı avladın. 🏆";
            durumYazi.style.color = "var(--dogru)";
            avla(a.id);
          } else {
            durumYazi.textContent = `🎯 Avlamak için ${toplam} soruyu da doğru cevapla (${bilinen}/${toplam})`;
          }
        } else {
          b.classList.add("yanlis");
          b.disabled = true;
          sonuc.textContent = "Olmadı, bir daha dene!";
          sonuc.style.color = "var(--yanlis)";
        }
      };
      secenekler.append(b);
    }
    kutu.append(secenekler, sonuc);
    icerik.append(kutu);
  });
}

if (secili) ayrinti(secili); else galeri();
</script>
</body>
</html>
